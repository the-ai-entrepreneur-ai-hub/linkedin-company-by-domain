name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install --no-fund --no-audit
      - run: npm test
      - name: Syntax check all sources
        run: for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Validate actor manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.actor/actor.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.actor/input_schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.actor/output_schema.json','utf8'))"
